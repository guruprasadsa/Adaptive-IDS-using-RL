# Grafana Dashboards Provisioning
apiVersion: 1

providers:
  - name: "Adaptive IDS Dashboards"
    orgId: 1
    folder: "Adaptive IDS"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
