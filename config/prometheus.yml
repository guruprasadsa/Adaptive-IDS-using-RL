# Prometheus Configuration for Adaptive IDS
global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    cluster: "adaptive-ids"
    environment: "production"

# Alerting configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - 'alertmanager:9093'

# Load rules once and periodically evaluate them
rule_files:
  # - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Backend API (Flask) - Optimized scraping
  - job_name: "backend-api"
    static_configs:
      - targets: ["backend:5001"]
    metrics_path: "/metrics"
    scrape_interval: 5s # More frequent for API monitoring
    scrape_timeout: 5s
    honor_labels: true

  # Model Inference Service (FastAPI) - High frequency for ML metrics
  - job_name: "model-service"
    static_configs:
      - targets: ["model-service:8000"]
    metrics_path: "/metrics"
    scrape_interval: 5s # Critical for ML performance monitoring
    scrape_timeout: 5s
    honor_labels: true

  # Feature Extractor (if running as separate service)
  - job_name: "feature-extractor"
    static_configs:
      - targets: ["feature-extractor:8001"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  # Alerting Service (if exposing metrics endpoint)
  - job_name: "alerting-service"
    static_configs:
      - targets: ["alerting-service:8002"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  # Kafka Exporter (optional - requires kafka-exporter sidecar)
  # - job_name: 'kafka'
  #   static_configs:
  #     - targets: ['kafka-exporter:9308']

  # PostgreSQL Exporter (optional - requires postgres-exporter sidecar)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # OTEL Collector metrics
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]
    metrics_path: "/metrics"
